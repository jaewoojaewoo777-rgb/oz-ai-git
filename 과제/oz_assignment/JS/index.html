<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>암호화폐 가격 변동 추적기</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header>
      <h1>암호화폐 가격 변동 추적기</h1>
      <p id="status" class="status">연결 중...</p>
    </header>

    <input id="search" type="search" placeholder="코인 검색 (예: BTC, ETH)" autocomplete="off" />

    <div class="tabs">
      <button class="tab active" data-tab="all">전체보기</button>
      <button class="tab" data-tab="fav">관심항목 <span id="favCount">0</span></button>
    </div>

    <table>
      <thead>
        <tr>
          <th class="star-col"></th>
          <th>코인</th>
          <th class="num">현재가 (USDT)</th>
          <th class="num">24h 변동률</th>
          <th class="num hide-sm">24h 거래대금</th>
        </tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
    <p id="empty" class="empty" hidden></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
